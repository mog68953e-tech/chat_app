name: chat_app
description: A high-performance real-time chat application built with Flutter & Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1

  # State Management
  flutter_bloc: ^8.1.4
  bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.2

  # Navigation
  go_router: ^13.2.0

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Network & Images
  dio: ^5.4.1
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Functional Programming
  dartz: ^0.10.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  rxdart: ^0.27.7
  path_provider: ^2.1.2
  path: ^1.9.0

  # Media
  record: ^6.2.0
  audioplayers: ^6.0.0
  permission_handler: ^11.3.0
  file_picker: ^8.0.3

  # UI & Animations
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  timeago: ^3.6.1

  # Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
